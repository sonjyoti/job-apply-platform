spring:
  application:
    name: jobapply-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/jobapply
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload:
    resume-dir: uploads/resumes